[project]
name = "captionband"
version = "0.10.0"
description = "Real-time webinar translation desktop app — Azure / Google / Groq / Whisper local — overlay PyQt6"
authors = [{ name = "Caio Fábio Schlechta Portella" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11,<3.14"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "Output",
    "graphify-out",
    "__pycache__",
    ".graphify_*.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter, not blocking
    "B008",   # function calls in argument defaults (PyQt patterns)
    "RUF001", # ambiguous unicode characters (we use × ▶ ⚙ on purpose)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# tests can be looser: fakes use mutable class defaults on purpose, and
# unpacking some values just to assert on others is idiomatic there.
"tests/*" = ["E", "F", "B", "RUF012", "RUF059"]
# translator.py must run CoInitializeEx(STA) BEFORE any import that transitively
# pulls soundcard (see the block-comment at the top of the file), so every
# import below _init_sta() is deliberately not at the top.
"translator.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
